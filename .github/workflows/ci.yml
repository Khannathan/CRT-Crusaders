name: CI

on:
  pull_request:
  # The sprite intake bot re-runs this after it pushes to an art branch.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every Sister card keeps exactly one locked GAME DATA block (art-bible/specs/LOCKS.md).
      - run: python3 tools/art_bible_data.py check
      - run: npm test
      - run: npm run build
      # Opens every screen on a fresh and a mid-game save (tools/smoke/screens.mjs).
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
